name: Unit Test Check

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read
  issues: write

jobs:
  run-tests:
    if: ${{ vars.UNIT_TEST_EXECUTION == 'true' }}
    runs-on: ubuntu-latest

    env:
      # Default coverage thresholds - will be overridden if COVERAGE_THRESHOLDS variable is set
      DEFAULT_COVERAGE_THRESHOLDS: '{"statements":80,"branches":80,"functions":80,"lines":80}'

    steps:
      - name: Check out the repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "22.13.1"

      - name: Set up .npmrc
        run: |
          echo "strict-ssl=false" > ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GPKG_TOKEN }}" >> ~/.npmrc
          echo "@TCB-Application-Development:registry=https://npm.pkg.github.com/" >> ~/.npmrc
          echo "registry=https://registry.npmjs.org/" >> ~/.npmrc
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPKG_TOKEN }}" >> ~/.npmrc
          echo "@tcb-application-development:registry=https://npm.pkg.github.com/" >> ~/.npmrc
          echo "@tcb-enterprise-services:registry=https://npm.pkg.github.com/" >> ~/.npmrc

      - name: Install dependencies
        run: npm install

      - name: Parse coverage thresholds
        id: parse-thresholds
        run: |
          # Get thresholds from repo variable or use default
          COVERAGE_THRESHOLDS='${{ vars.COVERAGE_THRESHOLDS || env.DEFAULT_COVERAGE_THRESHOLDS }}'
          echo "Using coverage thresholds: $COVERAGE_THRESHOLDS"
          
          # Extract individual thresholds and set as environment variables
          STATEMENTS_THRESHOLD=$(echo $COVERAGE_THRESHOLDS | jq -r '.statements // 80')
          BRANCHES_THRESHOLD=$(echo $COVERAGE_THRESHOLDS | jq -r '.branches // 80')
          FUNCTIONS_THRESHOLD=$(echo $COVERAGE_THRESHOLDS | jq -r '.functions // 80')
          LINES_THRESHOLD=$(echo $COVERAGE_THRESHOLDS | jq -r '.lines // 80')
          
          echo "STATEMENTS_THRESHOLD=$STATEMENTS_THRESHOLD" >> $GITHUB_ENV
          echo "BRANCHES_THRESHOLD=$BRANCHES_THRESHOLD" >> $GITHUB_ENV
          echo "FUNCTIONS_THRESHOLD=$FUNCTIONS_THRESHOLD" >> $GITHUB_ENV
          echo "LINES_THRESHOLD=$LINES_THRESHOLD" >> $GITHUB_ENV
          echo "COVERAGE_THRESHOLDS=$COVERAGE_THRESHOLDS" >> $GITHUB_ENV

      - name: Run tests with coverage
        id: test
        continue-on-error: true
        run: |
          # Run tests and capture all output
          # Strip ANSI color codes from output
          ng test --no-watch --code-coverage --browsers=ChromeHeadless | sed 's/\x1b\[[0-9;]*m//g' > test-output.txt 2>&1
          TEST_EXIT_CODE=${PIPESTATUS[0]}
          
          # Debug output
          echo "Test exit code: $TEST_EXIT_CODE"
          echo "Test output (without color codes):"
          cat test-output.txt
          
          # Set initial test status based on exit code
          if [ $TEST_EXIT_CODE -eq 0 ]; then
              echo "TEST_STATUS=success" >> $GITHUB_ENV
          else
              echo "TEST_STATUS=execution_failed" >> $GITHUB_ENV
          fi

          # Parse test results regardless of exit code
          if [ -f test-output.txt ]; then
              # Extract test execution results
              if grep -q "Executed.*SUCCESS" test-output.txt; then
                  TEST_OUTPUT=$(grep -o 'Executed.*SUCCESS' test-output.txt | tail -1)
                  TOTAL=$(echo "$TEST_OUTPUT" | cut -d' ' -f2)
                  FAILED=0
                  PASSED=$TOTAL
                  PASS_PERCENTAGE=100
              elif grep -q "Executed.*FAILURE" test-output.txt; then
                  TEST_OUTPUT=$(grep -o 'Executed.*FAILURE' test-output.txt | tail -1)
                  TOTAL=$(echo "$TEST_OUTPUT" | cut -d' ' -f2)
                  FAILED=$(grep -o '[0-9]* FAILED' test-output.txt | head -1 | cut -d' ' -f1 || echo "0")
                  PASSED=$((TOTAL - FAILED))
                  PASS_PERCENTAGE=$(awk "BEGIN { print ($PASSED/$TOTAL) * 100 }")
              elif grep -q "TOTAL:.*SUCCESS" test-output.txt; then
                  TEST_OUTPUT=$(grep -q 'TOTAL:.*SUCCESS' test-output.txt || echo "TOTAL: 0 SUCCESS")
                  TOTAL=$(echo "$TEST_OUTPUT" | cut -d' ' -f2 || echo "0")
                  if [ -z "$TOTAL" ] || [ "$TOTAL" = "0" ]; then
                      # Try to extract from line with just 'TOTAL: X SUCCESS'
                      TOTAL=$(grep 'TOTAL:' test-output.txt | grep 'SUCCESS' | awk '{print $2}')
                  fi
                  FAILED=0
                  PASSED=$TOTAL
                  PASS_PERCENTAGE=100
              else
                  # Cannot determine test results
                  TOTAL=$(grep -o "Executed [0-9]* of [0-9]*" test-output.txt | tail -1 | cut -d' ' -f2 || echo "0")
                  if [ -z "$TOTAL" ] || [ "$TOTAL" = "0" ]; then
                      TOTAL=$(grep 'TOTAL:' test-output.txt | awk '{print $2}')
                  fi
                  FAILED=0
                  PASSED=$TOTAL
                  PASS_PERCENTAGE=100
              fi
              
              echo "TOTAL_TESTS=$TOTAL" >> $GITHUB_ENV
              echo "PASSED_TESTS=$PASSED" >> $GITHUB_ENV
              echo "FAILED_TESTS=$FAILED" >> $GITHUB_ENV
              echo "PASS_PERCENTAGE=$PASS_PERCENTAGE" >> $GITHUB_ENV
              
              # Extract coverage from output 
              if grep -q "Coverage summary" test-output.txt; then
                  echo "Found coverage summary in output"
                  
                  # Initialize coverage variables
                  STATEMENTS_COVERAGE=0
                  BRANCHES_COVERAGE=0
                  FUNCTIONS_COVERAGE=0
                  LINES_COVERAGE=0
                  FAILED_THRESHOLDS=()
                  
                  # Extract coverage using more robust patterns
                  STATEMENTS_LINE=$(grep -A4 "Coverage summary" test-output.txt | grep "Statements")
                  BRANCHES_LINE=$(grep -A4 "Coverage summary" test-output.txt | grep "Branches")
                  FUNCTIONS_LINE=$(grep -A4 "Coverage summary" test-output.txt | grep "Functions")
                  LINES_LINE=$(grep -A4 "Coverage summary" test-output.txt | grep "Lines")
                  
                  echo "Coverage lines extracted:"
                  echo "Statements: $STATEMENTS_LINE"
                  echo "Branches: $BRANCHES_LINE"
                  echo "Functions: $FUNCTIONS_LINE"
                  echo "Lines: $LINES_LINE"
                  
                  # Extract percentages using more robust pattern matching
                  if [[ $STATEMENTS_LINE =~ ([0-9]+\.[0-9]+)% ]]; then
                      STATEMENTS_COVERAGE=${BASH_REMATCH[1]}
                  fi
                  
                  if [[ $BRANCHES_LINE =~ ([0-9]+\.[0-9]+)% ]]; then
                      BRANCHES_COVERAGE=${BASH_REMATCH[1]}
                  elif [[ $BRANCHES_LINE =~ ([0-9]+)% ]]; then
                      BRANCHES_COVERAGE=${BASH_REMATCH[1]}
                  fi
                  
                  if [[ $FUNCTIONS_LINE =~ ([0-9]+\.[0-9]+)% ]]; then
                      FUNCTIONS_COVERAGE=${BASH_REMATCH[1]}
                  fi
                  
                  if [[ $LINES_LINE =~ ([0-9]+\.[0-9]+)% ]]; then
                      LINES_COVERAGE=${BASH_REMATCH[1]}
                  fi
                  
                  echo "Extracted coverage metrics:"
                  echo "Statements: $STATEMENTS_COVERAGE%"
                  echo "Branches: $BRANCHES_COVERAGE%"
                  echo "Functions: $FUNCTIONS_COVERAGE%"
                  echo "Lines: $LINES_COVERAGE%"
                  
                  # Store coverage metrics as environment variables
                  echo "STATEMENTS_COVERAGE=$STATEMENTS_COVERAGE" >> $GITHUB_ENV
                  echo "BRANCHES_COVERAGE=$BRANCHES_COVERAGE" >> $GITHUB_ENV
                  echo "FUNCTIONS_COVERAGE=$FUNCTIONS_COVERAGE" >> $GITHUB_ENV
                  echo "LINES_COVERAGE=$LINES_COVERAGE" >> $GITHUB_ENV
                  
                  # Check each coverage metric against its threshold
                  if (( $(echo "$STATEMENTS_COVERAGE < $STATEMENTS_THRESHOLD" | bc -l) )); then
                      echo "Statements coverage ($STATEMENTS_COVERAGE%) is below threshold ($STATEMENTS_THRESHOLD%)"
                      FAILED_THRESHOLDS+=("Statements")
                  fi
                  
                  if (( $(echo "$BRANCHES_COVERAGE < $BRANCHES_THRESHOLD" | bc -l) )); then
                      echo "Branches coverage ($BRANCHES_COVERAGE%) is below threshold ($BRANCHES_THRESHOLD%)"
                      FAILED_THRESHOLDS+=("Branches")
                  fi
                  
                  if (( $(echo "$FUNCTIONS_COVERAGE < $FUNCTIONS_THRESHOLD" | bc -l) )); then
                      echo "Functions coverage ($FUNCTIONS_COVERAGE%) is below threshold ($FUNCTIONS_THRESHOLD%)"
                      FAILED_THRESHOLDS+=("Functions")
                  fi
                  
                  if (( $(echo "$LINES_COVERAGE < $LINES_THRESHOLD" | bc -l) )); then
                      echo "Lines coverage ($LINES_COVERAGE%) is below threshold ($LINES_THRESHOLD%)"
                      FAILED_THRESHOLDS+=("Lines")
                  fi
                  
                  # Store failed thresholds for reporting
                  if [ ${#FAILED_THRESHOLDS[@]} -gt 0 ]; then
                      echo "FAILED_THRESHOLDS=${FAILED_THRESHOLDS[*]}" >> $GITHUB_ENV
                      echo "TEST_STATUS=coverage_failed" >> $GITHUB_ENV
                  fi
              elif [ -f coverage/coverage-summary.json ]; then
                  # Extract from JSON file if available
                  echo "Using coverage summary JSON file"
                  STATEMENTS_COVERAGE=$(jq -r '.total.statements.pct' coverage/coverage-summary.json)
                  BRANCHES_COVERAGE=$(jq -r '.total.branches.pct' coverage/coverage-summary.json)
                  FUNCTIONS_COVERAGE=$(jq -r '.total.functions.pct' coverage/coverage-summary.json)
                  LINES_COVERAGE=$(jq -r '.total.lines.pct' coverage/coverage-summary.json)
                  
                  echo "Extracted coverage from JSON:"
                  echo "Statements: $STATEMENTS_COVERAGE%"
                  echo "Branches: $BRANCHES_COVERAGE%"
                  echo "Functions: $FUNCTIONS_COVERAGE%"
                  echo "Lines: $LINES_COVERAGE%"
                  
                  # Store coverage metrics as environment variables
                  echo "STATEMENTS_COVERAGE=$STATEMENTS_COVERAGE" >> $GITHUB_ENV
                  echo "BRANCHES_COVERAGE=$BRANCHES_COVERAGE" >> $GITHUB_ENV
                  echo "FUNCTIONS_COVERAGE=$FUNCTIONS_COVERAGE" >> $GITHUB_ENV
                  echo "LINES_COVERAGE=$LINES_COVERAGE" >> $GITHUB_ENV
                  
                  # Check each coverage metric against its threshold
                  FAILED_THRESHOLDS=()
                  
                  if (( $(echo "$STATEMENTS_COVERAGE < $STATEMENTS_THRESHOLD" | bc -l) )); then
                      FAILED_THRESHOLDS+=("Statements")
                  fi
                  
                  if (( $(echo "$BRANCHES_COVERAGE < $BRANCHES_THRESHOLD" | bc -l) )); then
                      FAILED_THRESHOLDS+=("Branches")
                  fi
                  
                  if (( $(echo "$FUNCTIONS_COVERAGE < $FUNCTIONS_THRESHOLD" | bc -l) )); then
                      FAILED_THRESHOLDS+=("Functions")
                  fi
                  
                  if (( $(echo "$LINES_COVERAGE < $LINES_THRESHOLD" | bc -l) )); then
                      FAILED_THRESHOLDS+=("Lines")
                  fi
                  
                  # Store failed thresholds for reporting
                  if [ ${#FAILED_THRESHOLDS[@]} -gt 0 ]; then
                      echo "FAILED_THRESHOLDS=${FAILED_THRESHOLDS[*]}" >> $GITHUB_ENV
                      echo "TEST_STATUS=coverage_failed" >> $GITHUB_ENV
                  fi
              else
                  echo "Could not determine coverage"
                  echo "TEST_STATUS=coverage_failed" >> $GITHUB_ENV
              fi
          else
              echo "Test output file not found"
              echo "TEST_STATUS=execution_failed" >> $GITHUB_ENV
          fi

      - name: Manage PR Comments
        uses: actions/github-script@v6
        with:
          github-token: ${{ github.token }}
          script: |
            // First, get all existing comments
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            
            // Delete existing unit test comments
            for (const comment of comments) {
              if ((comment.body.includes('Unit Test') || 
                  comment.body.includes('Test Results Summary')) &&
                  comment.user.login === 'github-actions[bot]') {
                try {
                  await github.rest.issues.deleteComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: comment.id
                  });
                } catch (error) {
                  console.error(`Error deleting comment ${comment.id}:`, error);
                }
              }
            }
            
            // Only create new comment if tests or coverage failed
            if (process.env.TEST_STATUS !== 'success') {
              // Prepare the new comment
              const status = process.env.TEST_STATUS;
              let message = "";
  
              switch(status) {
                  case 'execution_failed':
                      message += "**❌ Unit Test Run Failed**\n\n"
                      message += "The test execution failed. Please check the workflow logs for details.\n\n"
                      break;
                      
                  case 'coverage_failed':
                      message += "**❌ Coverage Thresholds Not Met**\n\n"
                      message += "One or more coverage metrics did not meet the minimum threshold.\n"
                      
                      // Add failed thresholds if available
                      if (process.env.FAILED_THRESHOLDS) {
                          const failedTypes = process.env.FAILED_THRESHOLDS.split(' ');
                          message += "**Failed metrics:** " + failedTypes.join(', ') + "\n\n";
                      }
                      
                      message += "Please add more test coverage to meet the thresholds.\n\n"
                      break;
                      
                  default:
                      message += "**❌ Test Process Error**\n\n"
                      message += "An unexpected error occurred during testing.\n\n"
              }
  
              // Add test summary
              message += "**Test Results Summary:**\n"
              message += `- Total Tests: ${process.env.TOTAL_TESTS || 'N/A'}\n`
              message += `- Passed: ${process.env.PASSED_TESTS || 0}\n`
              message += `- Failed: ${process.env.FAILED_TESTS || 'N/A'}\n`
              message += `- Pass Percentage: ${process.env.PASS_PERCENTAGE || 'N/A'}%\n\n`
              
              // Add coverage metrics in a simpler one-line format
              message += "**Coverage Metrics:** "
              message += `Statements ${process.env.STATEMENTS_COVERAGE || 'N/A'}% / ${process.env.STATEMENTS_THRESHOLD}%, `
              message += `Branches ${process.env.BRANCHES_COVERAGE || 'N/A'}% / ${process.env.BRANCHES_THRESHOLD}%, `
              message += `Functions ${process.env.FUNCTIONS_COVERAGE || 'N/A'}% / ${process.env.FUNCTIONS_THRESHOLD}%, `
              message += `Lines ${process.env.LINES_COVERAGE || 'N/A'}% / ${process.env.LINES_THRESHOLD}%\n\n`
              
              message += "**Thresholds:** "
              const thresholds = JSON.parse(process.env.COVERAGE_THRESHOLDS);
              message += `Set via COVERAGE_THRESHOLDS variable as a JSON object with keys: statements, branches, functions, lines`;
  
              // Post the new comment
              await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: message
              });
            }

      - name: Fail if tests failed or coverage is insufficient
        if: env.TEST_STATUS != 'success'
        run: |
          echo "::error::Tests failed or coverage thresholds not met. See PR comments for details."
          exit 1