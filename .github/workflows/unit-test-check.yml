name: Unit Test Check

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read
  issues: write

jobs:
  run-tests:
    if: ${{ vars.UNIT_TEST_EXECUTION == 'true' }}
    runs-on: ubuntu-latest

    env:
      # Default coverage thresholds - will be overridden if COVERAGE_THRESHOLDS variable is set
      DEFAULT_COVERAGE_THRESHOLDS: '{"statements":80,"branches":80,"functions":80,"lines":80}'

    steps:
      - name: Check out the repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "22.13.1"

      - name: Set up .npmrc
        run: |
          echo "strict-ssl=false" > ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GPKG_TOKEN }}" >> ~/.npmrc
          echo "@TCB-Application-Development:registry=https://npm.pkg.github.com/" >> ~/.npmrc
          echo "registry=https://registry.npmjs.org/" >> ~/.npmrc
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPKG_TOKEN }}" >> ~/.npmrc
          echo "@tcb-application-development:registry=https://npm.pkg.github.com/" >> ~/.npmrc
          echo "@tcb-enterprise-services:registry=https://npm.pkg.github.com/" >> ~/.npmrc

      - name: Install dependencies
        run: npm install

      - name: Parse coverage thresholds
        id: parse-thresholds
        run: |
          # Get thresholds from repo variable or use default
          COVERAGE_THRESHOLDS='${{ vars.COVERAGE_THRESHOLDS || env.DEFAULT_COVERAGE_THRESHOLDS }}'
          echo "Using coverage thresholds: $COVERAGE_THRESHOLDS"
          
          # Extract individual thresholds and set as environment variables
          STATEMENTS_THRESHOLD=$(echo $COVERAGE_THRESHOLDS | jq -r '.statements // 80')
          BRANCHES_THRESHOLD=$(echo $COVERAGE_THRESHOLDS | jq -r '.branches // 80')
          FUNCTIONS_THRESHOLD=$(echo $COVERAGE_THRESHOLDS | jq -r '.functions // 80')
          LINES_THRESHOLD=$(echo $COVERAGE_THRESHOLDS | jq -r '.lines // 80')
          
          echo "STATEMENTS_THRESHOLD=$STATEMENTS_THRESHOLD" >> $GITHUB_ENV
          echo "BRANCHES_THRESHOLD=$BRANCHES_THRESHOLD" >> $GITHUB_ENV
          echo "FUNCTIONS_THRESHOLD=$FUNCTIONS_THRESHOLD" >> $GITHUB_ENV
          echo "LINES_THRESHOLD=$LINES_THRESHOLD" >> $GITHUB_ENV
          echo "COVERAGE_THRESHOLDS=$COVERAGE_THRESHOLDS" >> $GITHUB_ENV

      - name: Run tests with coverage
        id: test
        continue-on-error: true
        run: |
          # Run tests and save output to file
          ng test --no-watch --code-coverage --browsers=ChromeHeadless > test-output.txt 2>&1
          TEST_EXIT_CODE=$?
          
          # Debug output - print test output for debugging
          echo "Test exit code: $TEST_EXIT_CODE"
          echo "===== BEGIN TEST OUTPUT ====="
          cat test-output.txt
          echo "===== END TEST OUTPUT ====="
          
          # Set initial test status based on exit code
          if [ $TEST_EXIT_CODE -eq 0 ]; then
              echo "TEST_STATUS=success" >> $GITHUB_ENV
          else
              echo "TEST_STATUS=execution_failed" >> $GITHUB_ENV
          fi

          # Find test metrics
          echo "Looking for test metrics..."
          grep -n "TOTAL" test-output.txt || echo "No TOTAL line found"
          grep -n "Executed" test-output.txt || echo "No Executed line found"
          
          # Set default metrics
          echo "TOTAL_TESTS=0" >> $GITHUB_ENV
          echo "PASSED_TESTS=0" >> $GITHUB_ENV
          echo "FAILED_TESTS=0" >> $GITHUB_ENV
          echo "PASS_PERCENTAGE=0" >> $GITHUB_ENV

          # ENHANCED DEBUGGING FOR COVERAGE
          echo "=== COVERAGE EXTRACTION DEBUGGING ==="
          echo "Searching for coverage file..."
          ls -la coverage/ || echo "No coverage directory found"
          
          # Check for coverage in JSON file
          if [ -f coverage/coverage-summary.json ]; then
              echo "Found coverage JSON file:"
              cat coverage/coverage-summary.json
              # Create an environment variable with the content
              COVERAGE_JSON=$(cat coverage/coverage-summary.json)
              echo "COVERAGE_JSON<<EOF" >> $GITHUB_ENV
              echo "$COVERAGE_JSON" >> $GITHUB_ENV
              echo "EOF" >> $GITHUB_ENV
          fi
          
          # Look for coverage in output file
          echo "Searching for Coverage summary in test output..."
          grep -A 10 "Coverage summary" test-output.txt || echo "No Coverage summary section found"
          
          # Try to extract coverage - save everything to a file we can inspect
          echo "Extracting coverage patterns..."
          
          # Create a clean version without ANSI codes
          cat test-output.txt | tr -d '\r' | sed 's/\x1b\[[0-9;]*m//g' > coverage-clean.txt
          echo "Cleaned output file (first 50 lines):"
          head -n 50 coverage-clean.txt
          
          # Try to extract coverage directly using grep patterns
          echo "Trying direct extraction:"
          
          # Extract using grep and export to env vars
          STATEMENTS_LINE=$(grep -i "statements" coverage-clean.txt || echo "NOT_FOUND")
          BRANCHES_LINE=$(grep -i "branches" coverage-clean.txt || echo "NOT_FOUND")
          FUNCTIONS_LINE=$(grep -i "functions" coverage-clean.txt || echo "NOT_FOUND")
          LINES_LINE=$(grep -i "lines" coverage-clean.txt || echo "NOT_FOUND")
          
          echo "Extracted lines:"
          echo "STATEMENTS: $STATEMENTS_LINE"
          echo "BRANCHES: $BRANCHES_LINE"
          echo "FUNCTIONS: $FUNCTIONS_LINE"
          echo "LINES: $LINES_LINE"
          
          # Capture all coverage information into a debug variable
          echo "COVERAGE_DEBUG<<EOF" >> $GITHUB_ENV
          echo "STATEMENTS: $STATEMENTS_LINE" >> $GITHUB_ENV
          echo "BRANCHES: $BRANCHES_LINE" >> $GITHUB_ENV
          echo "FUNCTIONS: $FUNCTIONS_LINE" >> $GITHUB_ENV
          echo "LINES: $LINES_LINE" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          
          # Try to extract percentages using different patterns
          echo "Extracting percentages with multiple patterns:"
          
          # Find percentages with different patterns
          if [[ "$STATEMENTS_LINE" != "NOT_FOUND" ]]; then
              echo "Percentage with pattern 1: $(echo "$STATEMENTS_LINE" | grep -o '[0-9.]\+%' || echo "NO_MATCH")"
              echo "Percentage with pattern 2: $(echo "$STATEMENTS_LINE" | grep -o '[0-9.]*%' || echo "NO_MATCH")"
              echo "Percentage with pattern 3: $(echo "$STATEMENTS_LINE" | sed -n 's/.*: \([0-9.]*%\).*/\1/p' || echo "NO_MATCH")"
          fi
          
          # Store extracted values in env vars for PR comment
          if [[ "$STATEMENTS_LINE" != "NOT_FOUND" ]]; then
              STATEMENTS_PCT=$(echo "$STATEMENTS_LINE" | grep -o '[0-9.]\+%' | sed 's/%//' || echo "")
              BRANCHES_PCT=$(echo "$BRANCHES_LINE" | grep -o '[0-9.]\+%' | sed 's/%//' || echo "")
              FUNCTIONS_PCT=$(echo "$FUNCTIONS_LINE" | grep -o '[0-9.]\+%' | sed 's/%//' || echo "")
              LINES_PCT=$(echo "$LINES_LINE" | grep -o '[0-9.]\+%' | sed 's/%//' || echo "")
              
              echo "Extracted percentages:"
              echo "Statements: $STATEMENTS_PCT%"
              echo "Branches: $BRANCHES_PCT%"
              echo "Functions: $FUNCTIONS_PCT%"
              echo "Lines: $LINES_PCT%"
              
              # Save to environment variables
              echo "STATEMENTS_COVERAGE=$STATEMENTS_PCT" >> $GITHUB_ENV
              echo "BRANCHES_COVERAGE=$BRANCHES_PCT" >> $GITHUB_ENV
              echo "FUNCTIONS_COVERAGE=$FUNCTIONS_PCT" >> $GITHUB_ENV
              echo "LINES_COVERAGE=$LINES_PCT" >> $GITHUB_ENV
          fi

      - name: Manage PR Comments
        uses: actions/github-script@v6
        with:
          github-token: ${{ github.token }}
          script: |
            // First, get all existing comments
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            
            // Delete existing unit test comments
            for (const comment of comments) {
              if ((comment.body.includes('Unit Test') || 
                  comment.body.includes('Test Results Summary')) &&
                  comment.user.login === 'github-actions[bot]') {
                try {
                  await github.rest.issues.deleteComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: comment.id
                  });
                } catch (error) {
                  console.error(`Error deleting comment ${comment.id}:`, error);
                }
              }
            }
            
            // Create a detailed debug comment
            let debugMessage = "## Test & Coverage Debug Information\n\n";
            
            // Add coverage debug info if available
            if (process.env.COVERAGE_DEBUG) {
              debugMessage += "### Coverage Extraction Results\n\n```\n";
              debugMessage += process.env.COVERAGE_DEBUG;
              debugMessage += "\n```\n\n";
            }
            
            // Add JSON coverage if found
            if (process.env.COVERAGE_JSON) {
              debugMessage += "### Coverage JSON\n\n```json\n";
              debugMessage += process.env.COVERAGE_JSON;
              debugMessage += "\n```\n\n";
            }
            
            // Add extracted metrics
            debugMessage += "### Extracted Coverage Values\n\n";
            debugMessage += `- Statements: ${process.env.STATEMENTS_COVERAGE || 'Not found'}%\n`;
            debugMessage += `- Branches: ${process.env.BRANCHES_COVERAGE || 'Not found'}%\n`;
            debugMessage += `- Functions: ${process.env.FUNCTIONS_COVERAGE || 'Not found'}%\n`;
            debugMessage += `- Lines: ${process.env.LINES_COVERAGE || 'Not found'}%\n\n`;
            
            // Add thresholds
            debugMessage += "### Coverage Thresholds\n\n";
            debugMessage += `- Statements: ${process.env.STATEMENTS_THRESHOLD}%\n`;
            debugMessage += `- Branches: ${process.env.BRANCHES_THRESHOLD}%\n`;
            debugMessage += `- Functions: ${process.env.FUNCTIONS_THRESHOLD}%\n`;
            debugMessage += `- Lines: ${process.env.LINES_THRESHOLD}%\n`;
            
            // Post the debug comment
            await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: debugMessage
            });