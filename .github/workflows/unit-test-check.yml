name: Unit Test Check

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read
  issues: write

jobs:
  run-tests:
    if: ${{ vars.UNIT_TEST_EXECUTION == 'true' }}
    runs-on: ubuntu-latest

    env:
      # Default coverage thresholds - will be overridden if COVERAGE_THRESHOLDS variable is set
      DEFAULT_COVERAGE_THRESHOLDS: '{"statements":80,"branches":80,"functions":80,"lines":80}'

    steps:
      - name: Check out the repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "22.13.1"

      - name: Set up .npmrc
        run: |
          echo "strict-ssl=false" > ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GPKG_TOKEN }}" >> ~/.npmrc
          echo "@TCB-Application-Development:registry=https://npm.pkg.github.com/" >> ~/.npmrc
          echo "registry=https://registry.npmjs.org/" >> ~/.npmrc
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPKG_TOKEN }}" >> ~/.npmrc
          echo "@tcb-application-development:registry=https://npm.pkg.github.com/" >> ~/.npmrc
          echo "@tcb-enterprise-services:registry=https://npm.pkg.github.com/" >> ~/.npmrc

      - name: Install dependencies
        run: npm install

      - name: Parse coverage thresholds
        id: parse-thresholds
        run: |
          # Get thresholds from repo variable or use default
          COVERAGE_THRESHOLDS='${{ vars.COVERAGE_THRESHOLDS || env.DEFAULT_COVERAGE_THRESHOLDS }}'
          echo "Using coverage thresholds: $COVERAGE_THRESHOLDS"
          
          # Extract individual thresholds and set as environment variables
          STATEMENTS_THRESHOLD=$(echo $COVERAGE_THRESHOLDS | jq -r '.statements // 80')
          BRANCHES_THRESHOLD=$(echo $COVERAGE_THRESHOLDS | jq -r '.branches // 80')
          FUNCTIONS_THRESHOLD=$(echo $COVERAGE_THRESHOLDS | jq -r '.functions // 80')
          LINES_THRESHOLD=$(echo $COVERAGE_THRESHOLDS | jq -r '.lines // 80')
          
          echo "STATEMENTS_THRESHOLD=$STATEMENTS_THRESHOLD" >> $GITHUB_ENV
          echo "BRANCHES_THRESHOLD=$BRANCHES_THRESHOLD" >> $GITHUB_ENV
          echo "FUNCTIONS_THRESHOLD=$FUNCTIONS_THRESHOLD" >> $GITHUB_ENV
          echo "LINES_THRESHOLD=$LINES_THRESHOLD" >> $GITHUB_ENV
          echo "COVERAGE_THRESHOLDS=$COVERAGE_THRESHOLDS" >> $GITHUB_ENV

      - name: Run tests with coverage
        id: test
        continue-on-error: true
        run: |
          # Run tests and save output to file
          ng test --no-watch --code-coverage --browsers=ChromeHeadless > test-output.txt 2>&1
          TEST_EXIT_CODE=$?
          
          # Debug output - print test output for debugging
          echo "Test exit code: $TEST_EXIT_CODE"
          echo "===== BEGIN TEST OUTPUT ====="
          cat test-output.txt
          echo "===== END TEST OUTPUT ====="
          
          # Set initial test status based on exit code
          if [ $TEST_EXIT_CODE -eq 0 ]; then
              echo "TEST_STATUS=success" >> $GITHUB_ENV
          else
              echo "TEST_STATUS=execution_failed" >> $GITHUB_ENV
          fi

          # Look for test results - first check for Executed tests
          if grep -q "Executed.*of.*" test-output.txt; then
              TEST_LINE=$(grep "Executed.*of.*" test-output.txt | tail -1)
              echo "Found test execution line: $TEST_LINE"
              
              # Extract numbers
              if [[ $TEST_LINE =~ Executed[[:space:]]+([0-9]+)[[:space:]]+of[[:space:]]+([0-9]+) ]]; then
                  EXECUTED=${BASH_REMATCH[1]}
                  TOTAL=${BASH_REMATCH[2]}
                  echo "Executed: $EXECUTED, Total: $TOTAL"
              fi
          # Check for TOTAL: X SUCCESS format
          elif grep -q "TOTAL:" test-output.txt; then
              TEST_LINE=$(grep "TOTAL:" test-output.txt | tail -1)
              echo "Found TOTAL line: $TEST_LINE"
              
              # Extract numbers
              if [[ $TEST_LINE =~ TOTAL:[[:space:]]+([0-9]+)[[:space:]]+ ]]; then
                  TOTAL=${BASH_REMATCH[1]}
                  EXECUTED=$TOTAL
                  echo "Total: $TOTAL"
              fi
          fi
          
          # Set test metrics
          if [ -n "$TOTAL" ] && [ "$TOTAL" -gt 0 ]; then
              echo "TOTAL_TESTS=$TOTAL" >> $GITHUB_ENV
              echo "PASSED_TESTS=$EXECUTED" >> $GITHUB_ENV
              echo "FAILED_TESTS=0" >> $GITHUB_ENV
              echo "PASS_PERCENTAGE=100" >> $GITHUB_ENV
          else
              echo "Could not determine test results"
              echo "TOTAL_TESTS=0" >> $GITHUB_ENV
              echo "PASSED_TESTS=0" >> $GITHUB_ENV
              echo "FAILED_TESTS=0" >> $GITHUB_ENV
              echo "PASS_PERCENTAGE=0" >> $GITHUB_ENV
          fi
          
          # Simple coverage extraction
          if grep -q "Coverage summary" test-output.txt; then
              echo "Found Coverage summary"
              
              # Extract metrics with simple grep patterns
              STATEMENTS_LINE=$(grep "Statements" test-output.txt | head -1)
              BRANCHES_LINE=$(grep "Branches" test-output.txt | head -1)
              FUNCTIONS_LINE=$(grep "Functions" test-output.txt | head -1)
              LINES_LINE=$(grep "Lines" test-output.txt | head -1)
              
              # Extract just the percentage numbers
              STATEMENTS_COVERAGE=$(echo "$STATEMENTS_LINE" | grep -o '[0-9.]\+%' | sed 's/%//')
              BRANCHES_COVERAGE=$(echo "$BRANCHES_LINE" | grep -o '[0-9.]\+%' | sed 's/%//')
              FUNCTIONS_COVERAGE=$(echo "$FUNCTIONS_LINE" | grep -o '[0-9.]\+%' | sed 's/%//')
              LINES_COVERAGE=$(echo "$LINES_LINE" | grep -o '[0-9.]\+%' | sed 's/%//')
              
              echo "Statements coverage: $STATEMENTS_COVERAGE%"
              echo "Branches coverage: $BRANCHES_COVERAGE%"
              echo "Functions coverage: $FUNCTIONS_COVERAGE%"
              echo "Lines coverage: $LINES_COVERAGE%"
              
              # Save to environment variables
              echo "STATEMENTS_COVERAGE=$STATEMENTS_COVERAGE" >> $GITHUB_ENV
              echo "BRANCHES_COVERAGE=$BRANCHES_COVERAGE" >> $GITHUB_ENV
              echo "FUNCTIONS_COVERAGE=$FUNCTIONS_COVERAGE" >> $GITHUB_ENV
              echo "LINES_COVERAGE=$LINES_COVERAGE" >> $GITHUB_ENV
              
              # Simple threshold check using integer comparison (no bc required)
              FAILED_THRESHOLDS=()
              
              if [ -n "$STATEMENTS_COVERAGE" ] && [ ${STATEMENTS_COVERAGE%.*} -lt ${STATEMENTS_THRESHOLD%.*} ]; then
                  FAILED_THRESHOLDS+=("Statements")
              fi
              
              if [ -n "$BRANCHES_COVERAGE" ] && [ ${BRANCHES_COVERAGE%.*} -lt ${BRANCHES_THRESHOLD%.*} ]; then
                  FAILED_THRESHOLDS+=("Branches")
              fi
              
              if [ -n "$FUNCTIONS_COVERAGE" ] && [ ${FUNCTIONS_COVERAGE%.*} -lt ${FUNCTIONS_THRESHOLD%.*} ]; then
                  FAILED_THRESHOLDS+=("Functions")
              fi
              
              if [ -n "$LINES_COVERAGE" ] && [ ${LINES_COVERAGE%.*} -lt ${LINES_THRESHOLD%.*} ]; then
                  FAILED_THRESHOLDS+=("Lines")
              fi
              
              # Store failed thresholds for reporting
              if [ ${#FAILED_THRESHOLDS[@]} -gt 0 ]; then
                  echo "FAILED_THRESHOLDS=${FAILED_THRESHOLDS[*]}" >> $GITHUB_ENV
                  echo "TEST_STATUS=coverage_failed" >> $GITHUB_ENV
              fi
          elif [ -f coverage/coverage-summary.json ]; then
              echo "Using coverage JSON file"
              cat coverage/coverage-summary.json
              
              STATEMENTS_COVERAGE=$(jq -r '.total.statements.pct' coverage/coverage-summary.json)
              BRANCHES_COVERAGE=$(jq -r '.total.branches.pct' coverage/coverage-summary.json)
              FUNCTIONS_COVERAGE=$(jq -r '.total.functions.pct' coverage/coverage-summary.json)
              LINES_COVERAGE=$(jq -r '.total.lines.pct' coverage/coverage-summary.json)
              
              echo "STATEMENTS_COVERAGE=$STATEMENTS_COVERAGE" >> $GITHUB_ENV
              echo "BRANCHES_COVERAGE=$BRANCHES_COVERAGE" >> $GITHUB_ENV
              echo "FUNCTIONS_COVERAGE=$FUNCTIONS_COVERAGE" >> $GITHUB_ENV
              echo "LINES_COVERAGE=$LINES_COVERAGE" >> $GITHUB_ENV
              
              # Check which thresholds failed - using simplified integer comparison for JSON values too
              FAILED_THRESHOLDS=()
              
              if [ -n "$STATEMENTS_COVERAGE" ] && [ ${STATEMENTS_COVERAGE%.*} -lt ${STATEMENTS_THRESHOLD%.*} ]; then
                  FAILED_THRESHOLDS+=("Statements")
              fi
              
              if [ -n "$BRANCHES_COVERAGE" ] && [ ${BRANCHES_COVERAGE%.*} -lt ${BRANCHES_THRESHOLD%.*} ]; then
                  FAILED_THRESHOLDS+=("Branches")
              fi
              
              if [ -n "$FUNCTIONS_COVERAGE" ] && [ ${FUNCTIONS_COVERAGE%.*} -lt ${FUNCTIONS_THRESHOLD%.*} ]; then
                  FAILED_THRESHOLDS+=("Functions")
              fi
              
              if [ -n "$LINES_COVERAGE" ] && [ ${LINES_COVERAGE%.*} -lt ${LINES_THRESHOLD%.*} ]; then
                  FAILED_THRESHOLDS+=("Lines")
              fi
              
              # Store failed thresholds for reporting
              if [ ${#FAILED_THRESHOLDS[@]} -gt 0 ]; then
                  echo "FAILED_THRESHOLDS=${FAILED_THRESHOLDS[*]}" >> $GITHUB_ENV
                  echo "TEST_STATUS=coverage_failed" >> $GITHUB_ENV
              fi
          else
              echo "Could not find coverage data"
              # Don't fail the build just because we couldn't find coverage data
              # if the tests passed
          fi

      - name: Manage PR Comments
        uses: actions/github-script@v6
        with:
          github-token: ${{ github.token }}
          script: |
            // First, get all existing comments
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            
            // Delete existing unit test comments
            for (const comment of comments) {
              if ((comment.body.includes('Unit Test') || 
                  comment.body.includes('Test Results Summary')) &&
                  comment.user.login === 'github-actions[bot]') {
                try {
                  await github.rest.issues.deleteComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: comment.id
                  });
                } catch (error) {
                  console.error(`Error deleting comment ${comment.id}:`, error);
                }
              }
            }
            
            // Only create new comment if tests or coverage failed
            if (process.env.TEST_STATUS !== 'success') {
              // Prepare the new comment
              const status = process.env.TEST_STATUS;
              let message = "";
  
              switch(status) {
                  case 'execution_failed':
                      message += "**❌ Unit Test Run Failed**\n\n"
                      message += "The test execution failed. Please check the workflow logs for details.\n\n"
                      break;
                      
                  case 'coverage_failed':
                      message += "**❌ Coverage Thresholds Not Met**\n\n"
                      message += "One or more coverage metrics did not meet the minimum threshold.\n"
                      
                      // Add failed thresholds if available
                      if (process.env.FAILED_THRESHOLDS) {
                          const failedTypes = process.env.FAILED_THRESHOLDS.split(' ');
                          message += "**Failed metrics:** " + failedTypes.join(', ') + "\n\n";
                      }
                      
                      message += "Please add more test coverage to meet the thresholds.\n\n"
                      break;
                      
                  default:
                      message += "**❌ Test Process Error**\n\n"
                      message += "An unexpected error occurred during testing.\n\n"
              }
  
              // Add test summary
              message += "**Test Results Summary:**\n"
              message += `- Total Tests: ${process.env.TOTAL_TESTS || 'N/A'}\n`
              message += `- Passed: ${process.env.PASSED_TESTS || 0}\n`
              message += `- Failed: ${process.env.FAILED_TESTS || 'N/A'}\n`
              message += `- Pass Percentage: ${process.env.PASS_PERCENTAGE || 'N/A'}%\n\n`
              
              // Format the coverage metrics line
              const formatCoverage = (value, threshold) => {
                return value ? `${value}% / ${threshold}%` : `N/A / ${threshold}%`;
              };
              
              message += "**Coverage Metrics:**\n";
              message += `- Statements: ${formatCoverage(process.env.STATEMENTS_COVERAGE, process.env.STATEMENTS_THRESHOLD)}\n`;
              message += `- Branches: ${formatCoverage(process.env.BRANCHES_COVERAGE, process.env.BRANCHES_THRESHOLD)}\n`;
              message += `- Functions: ${formatCoverage(process.env.FUNCTIONS_COVERAGE, process.env.FUNCTIONS_THRESHOLD)}\n`;
              message += `- Lines: ${formatCoverage(process.env.LINES_COVERAGE, process.env.LINES_THRESHOLD)}\n\n`;
              
              message += "**Note:** Coverage thresholds can be configured via repository variable `COVERAGE_THRESHOLDS` as a JSON object.";
  
              // Post the new comment
              await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: message
              });
            }

      - name: Fail if tests failed or coverage is insufficient
        if: env.TEST_STATUS != 'success'
        run: |
          echo "::error::Tests failed or coverage thresholds not met. See PR comments for details."
          exit 1